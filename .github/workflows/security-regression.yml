name: Backend security regression checks
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx --yes eslint@8.57.1 --no-eslintrc --env es2022,node --global fetch --global AbortController --global URL --rule 'no-undef:error' server.js
      - run: npm test
