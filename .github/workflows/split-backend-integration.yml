name: Split backend end-to-end integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sidik11/render1
          path: render1
      - uses: actions/checkout@v4
        with:
          repository: sidik11/render2
          path: render2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: render1
      - run: npm ci
        working-directory: render2
      - run: npm run build
        working-directory: render1
      - run: npm run build
        working-directory: render2
      - run: node --test tests/split-backend.integration.test.js
        working-directory: render2
